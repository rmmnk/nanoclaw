name: Feature Request
description: Request a new feature for Claude to implement
labels: ["enhancement", "claude"]
body:
  - type: textarea
    id: description
    attributes:
      label: What do you want?
      description: Describe the feature clearly. Claude will implement it and create a PR.
      placeholder: "Add a /status command that shows VPS health..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any constraints, preferences, or files to modify (optional)
      placeholder: "Should be a new workflow in .github/workflows/"
    validations:
      required: false
