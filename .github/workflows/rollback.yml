name: Rollback

on:
  workflow_dispatch:
    inputs:
      commits_back:
        description: 'Number of commits to roll back (default: 1)'
        required: false
        default: '1'
      confirm:
        description: 'Type ROLLBACK to confirm'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'ROLLBACK' }}
    steps:
      - name: Rollback on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMMITS_BACK: ${{ github.event.inputs.commits_back }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: COMMITS_BACK
          command_timeout: 5m
          script: |
            set -e
            cd ~/nanoclaw

            CURRENT=$(git rev-parse --short HEAD)
            TARGET=$(git rev-parse --short HEAD~${COMMITS_BACK})

            echo "==> Rolling back from ${CURRENT} to ${TARGET} (${COMMITS_BACK} commit(s) back)"
            echo "==> Target commit:"
            git log --oneline -1 HEAD~${COMMITS_BACK}

            git checkout HEAD~${COMMITS_BACK} -- .
            git checkout HEAD~${COMMITS_BACK} -- package-lock.json package.json

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building TypeScript..."
            npm run build

            echo "==> Restarting nanoclaw service..."
            systemctl --user restart nanoclaw

            sleep 3
            systemctl --user status nanoclaw --no-pager --lines=5

            echo "==> Rollback complete: ${CURRENT} -> ${TARGET}"
            echo "==> NOTE: This is a working directory rollback. Git history is unchanged."
            echo "==> To make permanent, push a revert commit from your dev environment."
