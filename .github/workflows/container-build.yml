name: Build Agent Container

on:
  push:
    branches: [main]
    paths:
      - 'container/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./container
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/nanoclaw-agent:latest
            ghcr.io/${{ github.repository_owner }}/nanoclaw-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy image to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "==> Pulling pre-built container image..."
            docker pull ghcr.io/${{ github.repository_owner }}/nanoclaw-agent:latest
            docker tag ghcr.io/${{ github.repository_owner }}/nanoclaw-agent:latest nanoclaw-agent:latest
            echo "==> Container image updated on VPS"
