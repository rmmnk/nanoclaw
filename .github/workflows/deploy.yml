name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys — queue them instead of canceling
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Run CI checks first — deploy only if they pass
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd ~/nanoclaw

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Installing dependencies..."
            npm ci

            echo "==> Building TypeScript..."
            npm run build

            echo "==> Restarting nanoclaw service..."
            systemctl --user restart nanoclaw

            echo "==> Waiting for service to stabilize..."
            sleep 3
            systemctl --user status nanoclaw --no-pager --lines=10

            echo "==> Syncing to private agents repo..."
            cd ~/nanoclaw/groups
            bash ~/nanoclaw/scripts/sync-agents.sh || echo "WARN: agents sync failed (non-fatal)"

            echo "==> Deploy complete"
