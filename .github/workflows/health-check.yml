name: VPS Health Check

on:
  schedule:
    # Daily at 08:00 UTC (midnight PT)
    - cron: '0 8 * * *'
  workflow_dispatch:  # Manual trigger from GitHub UI

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SSH health check
        id: health
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          script: |
            set -e

            echo "=== System ==="
            # Memory
            MEM_TOTAL=$(free -m | awk '/Mem:/ {print $2}')
            MEM_USED=$(free -m | awk '/Mem:/ {print $3}')
            MEM_AVAIL=$(free -m | awk '/Mem:/ {print $7}')
            MEM_PCT=$((MEM_USED * 100 / MEM_TOTAL))
            echo "RAM: ${MEM_USED}MB / ${MEM_TOTAL}MB (${MEM_PCT}% used, ${MEM_AVAIL}MB available)"

            # Swap
            SWAP_TOTAL=$(free -m | awk '/Swap:/ {print $2}')
            if [ "$SWAP_TOTAL" -eq 0 ]; then
              echo "WARN: No swap configured"
            else
              SWAP_USED=$(free -m | awk '/Swap:/ {print $3}')
              echo "Swap: ${SWAP_USED}MB / ${SWAP_TOTAL}MB"
            fi

            # Disk
            DISK_PCT=$(df / | awk 'NR==2 {gsub(/%/,""); print $5}')
            DISK_AVAIL=$(df -h / | awk 'NR==2 {print $4}')
            echo "Disk: ${DISK_PCT}% used (${DISK_AVAIL} free)"

            # Uptime
            echo "Uptime: $(uptime -p)"

            echo ""
            echo "=== NanoClaw ==="
            # Service status
            if systemctl --user is-active --quiet nanoclaw; then
              echo "Service: RUNNING"
              UPTIME=$(systemctl --user show nanoclaw --property=ActiveEnterTimestamp --value)
              echo "Since: $UPTIME"
            else
              echo "CRITICAL: nanoclaw service is NOT running"
              systemctl --user status nanoclaw --no-pager --lines=5 || true
            fi

            echo ""
            echo "=== Timers ==="
            systemctl --user list-timers --no-pager 2>/dev/null || echo "No timers"

            echo ""
            echo "=== Alerts ==="
            ALERTS=0

            # Check if service is down
            if ! systemctl --user is-active --quiet nanoclaw; then
              echo "ALERT: nanoclaw service is DOWN"
              ALERTS=$((ALERTS + 1))
            fi

            # Check memory > 85%
            if [ "$MEM_PCT" -gt 85 ]; then
              echo "ALERT: Memory usage at ${MEM_PCT}%"
              ALERTS=$((ALERTS + 1))
            fi

            # Check disk > 80%
            if [ "$DISK_PCT" -gt 80 ]; then
              echo "ALERT: Disk usage at ${DISK_PCT}%"
              ALERTS=$((ALERTS + 1))
            fi

            # Check no swap
            if [ "$SWAP_TOTAL" -eq 0 ]; then
              echo "ALERT: No swap configured (OOM risk)"
              ALERTS=$((ALERTS + 1))
            fi

            if [ "$ALERTS" -eq 0 ]; then
              echo "All clear - no alerts"
            else
              echo "Total alerts: $ALERTS"
            fi

      - name: Notify Slack on failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10s
          script: |
            SLACK_TOKEN=$(grep SLACK_BOT_TOKEN ~/nanoclaw/.env | cut -d= -f2)
            CHANNEL="C0AHNK1F5NJ"
            curl -s -X POST https://slack.com/api/chat.postMessage \
              -H "Authorization: Bearer $SLACK_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"channel\":\"$CHANNEL\",\"text\":\"*VPS Health Check Failed*\nThe daily health check could not reach the VPS or found critical issues. Check GitHub Actions for details.\"}"
