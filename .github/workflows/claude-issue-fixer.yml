name: Claude Issue Fixer

on:
  issues:
    types: [opened, labeled]

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'claude'
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are fixing a GitHub issue. Read the issue carefully and make the code changes needed.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}

            Instructions:
            1. Read the relevant files
            2. Make the minimal changes needed
            3. Commit your changes with a descriptive message referencing issue #${{ github.event.issue.number }}
            4. Push to a new branch named "claude/issue-${{ github.event.issue.number }}"
          claude_args: "--model claude-sonnet-4-6 --max-turns 20 --dangerously-skip-permissions"
          show_full_output: true

      - name: Create PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="claude/issue-${{ github.event.issue.number }}"
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            gh pr create \
              --head "$BRANCH" \
              --base main \
              --title "${{ github.event.issue.title }}" \
              --body "Fixes #${{ github.event.issue.number }}

          Auto-generated by Claude Issue Fixer." || echo "PR already exists or creation failed"
          else
            echo "No branch pushed, skipping PR creation"
          fi
