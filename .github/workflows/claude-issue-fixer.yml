name: Claude Issue Fixer

on:
  issues:
    types: [opened, labeled]

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'claude')
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Fix the following GitHub issue. Read the issue title and body carefully.
            Make the minimal code changes needed. Create a PR with the fix.

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
