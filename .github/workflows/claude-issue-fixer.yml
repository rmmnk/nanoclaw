name: Claude Issue Fixer

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  fix-issue:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.issue.labels.*.name, 'claude') && !github.event.issue.pull_request)
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: "claude"
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
