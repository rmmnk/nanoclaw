name: Rainbow Trader Report

on:
  schedule:
    # Sunday 22:00 UTC (2pm PT)
    - cron: '0 22 * * 0'
  workflow_dispatch:  # Manual trigger

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch scripts from VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30s
          script: |
            # Tar up the rainbow trader scripts for transfer
            cd ~/nanoclaw/groups/main/skills/rainbow-trader
            tar czf /tmp/rainbow-trader-scripts.tar.gz \
              rainbow_data.py rainbow_charts.py generate_report.py send_slack.py SKILL.md

      - name: Download scripts from VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          scp -i ~/.ssh/vps_key -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/rainbow-trader-scripts.tar.gz .
          mkdir -p rainbow-trader
          tar xzf rainbow-trader-scripts.tar.gz -C rainbow-trader/
          rm -f ~/.ssh/vps_key

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests matplotlib anthropic slack_sdk

      - name: Fetch market data
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: |
          cd rainbow-trader
          python rainbow_data.py > /tmp/rainbow_data.json
          echo "Data fetched successfully"
          python -c "import json; d=json.load(open('/tmp/rainbow_data.json')); print(f'BTC: {d.get(\"rainbow_chart\",{}).get(\"btc_price\",\"?\")}')"

      - name: Generate charts
        env:
          CHART_OUTPUT_DIR: ./rainbow-trader/charts
        run: |
          cd rainbow-trader
          mkdir -p charts
          cat /tmp/rainbow_data.json | python rainbow_charts.py
          echo "Charts generated:"
          ls -la charts/

      - name: Generate Claude report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd rainbow-trader
          python generate_report.py /tmp/rainbow_data.json
          echo "Report generated:"
          head -5 /tmp/rainbow_report.txt

      - name: Send to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: C0AHNK1F5NJ
        run: |
          cd rainbow-trader
          python send_slack.py /tmp/rainbow_report.txt ./charts
          echo "Sent to Slack"
